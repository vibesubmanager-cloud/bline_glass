name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the website at the Render API
        env:
          API: ${{ secrets.RENDER_API_URL }}
        run: |
          API="${API%/}"
          if [ -n "$API" ]; then
            printf 'export const DEFAULT_API_BASE = "%s";\n' "$API" > frontend/js/api-config.js
          fi
      - name: Give the phone the Gemini key
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            python3 -c 'import os; from pathlib import Path; key=os.environ["KEY"].strip(); Path("frontend/js/vision-config.js").write_text("export const GEMINI_API_KEY = " + repr(key) + ";\n")'
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
