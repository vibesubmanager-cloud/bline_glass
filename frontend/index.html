<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nyota Sight" />
    <meta name="theme-color" content="#04070d" />
    <meta name="description" content="Nyota Sight assistive vision for blind and visually impaired users." />
    <title>Nyota Sight</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/main.css" />
    <script>
      (function () {
        var ios = /iPad|iPhone|iPod/i.test(navigator.userAgent || "");
        if ("serviceWorker" in navigator) {
          if (ios) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); })
              .catch(function () {});
          } else {
            navigator.serviceWorker.register("./sw.js").catch(function () {});
          }
        }
        if (!localStorage.getItem("NYOTA_DISCLAIMER_AGREED_AT")) {
          location.replace("./pages/disclaimer.html");
          return;
        }
        const token = localStorage.getItem("VIBE_EYE_TOKEN") || sessionStorage.getItem("VIBE_EYE_TOKEN");
        if (!token) {
          location.replace("./pages/welcome.html");
          return;
        }
        var user = {};
        try {
          user = JSON.parse(localStorage.getItem("VIBE_EYE_USER") || sessionStorage.getItem("VIBE_EYE_USER") || "{}") || {};
        } catch (error) {
          user = {};
        }
        var privacyKey = "NYOTA_PRIVACY_POLICY_" + (user.id || "account");
        var privacyAgreed = Boolean(user.privacy_policy_agreed_at || localStorage.getItem(privacyKey));
        if (!privacyAgreed) {
          location.replace("./pages/privacy-policy.html");
          return;
        }
        if (user.role === "assistant") {
          location.replace("./pages/contacts.html");
          return;
        }
        location.replace("./pages/permissions.html");
      })();
    </script>
  </head>
  <body></body>
</html>
