<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nyota Sight" />
    <meta name="theme-color" content="#04070d" />
    <meta name="description" content="Nyota Sight assistive vision for blind and visually impaired users." />
    <title>Nyota Sight</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/main.css" />
    <script>
      (function () {
        var ios = /iPad|iPhone|iPod/i.test(navigator.userAgent || "");
        if ("serviceWorker" in navigator) {
          if (ios) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); })
              .catch(function () {});
          } else {
            navigator.serviceWorker.register("./sw.js").catch(function () {});
          }
        }
        const token = localStorage.getItem("VIBE_EYE_TOKEN") || sessionStorage.getItem("VIBE_EYE_TOKEN");
        function tokenExpired(value) {
          var part = String(value || "").split(".")[1];
          if (!part) return true;
          try {
            var json = JSON.parse(atob(part.replace(/-/g, "+").replace(/_/g, "/")));
            if (!json || !json.exp) return false;
            return Date.now() >= Number(json.exp) * 1000 - 5000;
          } catch (error) {
            return true;
          }
        }
        if (token && tokenExpired(token)) {
          var endedRole = "blind";
          try {
            endedRole = (JSON.parse(localStorage.getItem("VIBE_EYE_USER") || sessionStorage.getItem("VIBE_EYE_USER") || "{}") || {}).role === "assistant" ? "assistant" : "blind";
          } catch (error) {
            endedRole = "blind";
          }
          ["VIBE_EYE_TOKEN", "VIBE_EYE_USER", "VIBE_EYE_SETTINGS", "VIBE_EYE_LINKED_BLIND", "AISIGHT_DEVICE_READY", "AISIGHT_GPS_OK"].forEach(function (key) {
            localStorage.removeItem(key);
            sessionStorage.removeItem(key);
          });
          sessionStorage.removeItem("NYOTA_PRIVACY_REQUIRED");
          sessionStorage.setItem("NYOTA_JUST_SIGNED_OUT", "1");
          location.replace("./pages/login.html?role=" + endedRole);
          return;
        }
        if (!token) {
          location.replace("./pages/welcome.html");
          return;
        }
        if (sessionStorage.getItem("NYOTA_PRIVACY_REQUIRED") === "1") {
          location.replace("./pages/privacy-policy.html");
          return;
        }
        var user = {};
        try {
          user = JSON.parse(localStorage.getItem("VIBE_EYE_USER") || sessionStorage.getItem("VIBE_EYE_USER") || "{}") || {};
        } catch (error) {
          user = {};
        }
        if (user.role === "assistant") {
          location.replace("./pages/contacts.html");
          return;
        }
        location.replace("./pages/home.html");
      })();
    </script>
  </head>
  <body></body>
</html>
