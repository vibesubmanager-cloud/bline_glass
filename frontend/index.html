<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Sight" />
    <meta name="theme-color" content="#04070d" />
    <meta name="description" content="AI Sight assistive vision for blind and visually impaired users." />
    <title>AI Sight</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/main.css" />
    <script>
      const token = sessionStorage.getItem("VIBE_EYE_TOKEN");
      if (!token) {
        location.replace("./pages/welcome.html");
      } else {
        let role = "blind";
        try {
          role = JSON.parse(sessionStorage.getItem("VIBE_EYE_USER") || "{}").role || "blind";
        } catch {
          role = "blind";
        }
        location.replace(role === "assistant" ? "./pages/contacts.html" : "./pages/home.html");
      }
    </script>
  </head>
  <body>
    <p>Opening AI Sight…</p>
  </body>
</html>
