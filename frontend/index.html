<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Sight" />
    <meta name="theme-color" content="#04070d" />
    <meta name="description" content="AI Sight assistive vision for blind and visually impaired users." />
    <title>AI Sight</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/main.css" />
    <script>
      (function () {
        const token = localStorage.getItem("VIBE_EYE_TOKEN") || sessionStorage.getItem("VIBE_EYE_TOKEN");
        if (!token) {
          location.replace("./pages/welcome.html");
        } else {
          let role = "blind";
          try {
            role = JSON.parse(localStorage.getItem("VIBE_EYE_USER") || sessionStorage.getItem("VIBE_EYE_USER") || "{}").role || "blind";
          } catch {
            role = "blind";
          }
          location.replace(role === "assistant" ? "./pages/contacts.html" : "./pages/home.html");
        }
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => Promise.all(regs.map((reg) => reg.unregister())))
            .catch(() => undefined);
        }
      })();
    </script>
  </head>
  <body></body>
</html>
