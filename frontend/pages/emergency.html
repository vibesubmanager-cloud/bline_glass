<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <title>Emergency — vibeEye</title>
    <link rel="stylesheet" href="../css/main.css?v=31" />
    <link rel="stylesheet" href="../css/accessibility.css?v=6" />
    <link rel="stylesheet" href="../css/responsive.css?v=8" />
  </head>
  <body class="page-panel has-dock chat-page">
    <main class="app-shell chat-shell">
      <header class="brand contacts-head">
        <div class="brand-copy">
          <p class="brand-kicker">Emergency</p>
          <h1 id="chat-title">Emergency chat</h1>
        </div>
        <div class="chat-call-actions">
          <button class="btn icon-btn primary" id="em-call" type="button" aria-label="Voice call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15c4-4 8-4 12 0"/></svg>
          </button>
          <button class="btn icon-btn" id="em-video" type="button" aria-label="Video call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="11" height="10" rx="2"/><path d="M14 10l7-3v10l-7-3z"/></svg>
          </button>
        </div>
      </header>
      <p id="chat-status" class="status-bar" role="status" aria-live="polite">Text, voice note, photo, or map. Use call or video call when you are ready.</p>
      <section id="chat-thread" class="chat-thread" aria-label="Emergency messages"></section>
      <form id="chat-form" class="chat-composer">
        <div class="chat-bar">
          <button class="btn icon-btn chat-tool" id="chat-photo" type="button" aria-label="Send a picture">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="8" cy="11" r="1.5"/><path d="M21 16l-5-5-7 7"/></svg>
          </button>
          <button class="btn icon-btn chat-tool" id="chat-voice" type="button" aria-label="Record a voice note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
          </button>
          <button class="btn icon-btn chat-tool" id="chat-location" type="button" aria-label="Send location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-7 7-12a7 7 0 10-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          </button>
          <label class="sr-only" for="chat-input">Message</label>
          <input id="chat-input" name="body" type="text" placeholder="Emergency message" autocomplete="off" />
          <button class="chat-send" id="chat-send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l18-9-7 18-2-7-9-2z"/></svg>
          </button>
        </div>
        <input id="chat-file" class="sr-only" type="file" accept="image/*" capture="environment" />
      </form>
      <section id="call-overlay" class="call-overlay hidden" aria-label="Call">
        <p id="call-status-text">Calling</p>
        <div id="jitsi-container" class="jitsi-container" aria-hidden="true"></div>
        <div class="call-controls">
          <button id="call-answer" class="ok hidden" type="button" aria-label="Answer call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12l4 4 8-8"/></svg>
          </button>
          <button id="call-decline" class="danger hidden" type="button" aria-label="Decline call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button id="call-mute" type="button" aria-label="Mute microphone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button id="call-camera" type="button" aria-label="Toggle camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="11" height="10" rx="2"/><path d="M14 10l7-3v10l-7-3z"/></svg>
          </button>
          <button id="call-end" class="danger" type="button" aria-label="End call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15c4-4 8-4 12 0"/><path d="M8 18l-2-3 3-1M16 18l2-3-3-1"/></svg>
          </button>
        </div>
      </section>
      <audio id="remote-audio" autoplay playsinline></audio>
    </main>
    <nav class="dock" aria-label="Main">
      <a class="dock-btn" href="./home.html" aria-label="Live camera"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg></a>
      <a class="dock-btn dock-emergency is-active" href="./emergency.html" aria-label="Emergency"><svg viewBox="0 0 24 24"><path d="M12 3l9 18H3L12 3z"/><path d="M12 10v5"/><circle cx="12" cy="17.5" r="0.9"/></svg></a>
      <a class="dock-btn" href="./contacts.html" aria-label="Contacts"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.7"/><path d="M2.6 19c1-3.5 3.8-5.4 5.4-5.4s4.4 1.9 5.4 5.4"/><circle cx="16.6" cy="8.5" r="2.3"/><path d="M21.8 19c-.8-2.8-3-4.5-5-4.5-.8 0-1.5.2-2.1.6"/></svg></a>
      <a class="dock-btn" href="./profile.html" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg></a>
      <a class="dock-btn" href="./plans.html" aria-label="Plans"><svg viewBox="0 0 24 24"><path d="M12 3l2.15 5.2 5.6.5-4.25 3.7 1.3 5.5L12 15.3 7.2 17.9l1.3-5.5L4.25 8.7l5.6-.5z"/></svg></a>
      <a class="dock-btn" href="./settings.html" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg></a>
    </nav>
    <script type="module" src="../js/chatPage.js?v=7"></script>
  </body>
</html>
