<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Navigation — AI Sight</title>
    <link rel="stylesheet" href="../css/main.css?v=16" />
    <link rel="stylesheet" href="../css/accessibility.css?v=6" />
    <link rel="stylesheet" href="../css/responsive.css?v=8" />
  </head>
  <body class="page-panel has-dock">
    <main class="app-shell">
      <header class="brand">
        <h1>Navigation</h1>
        <p>Type a place, or say it from the camera screen.</p>
      </header>
      <p id="nav-status" class="status-bar" role="status" aria-live="polite">Ready to navigate.</p>
      <form id="nav-form" class="form-stack">
        <label>Destination <input id="destination" name="destination" required placeholder="Jagat Market" /></label>
        <button class="btn primary" type="submit">Start navigation</button>
        <button class="btn" id="stop-nav" type="button">Stop</button>
        <button class="btn" id="repeat-nav" type="button">Repeat</button>
      </form>
    </main>
    <nav class="dock" aria-label="Main">
      <a class="dock-btn" href="./home.html" aria-label="Live camera"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg></a>
      <a class="dock-btn dock-emergency" href="./emergency.html" aria-label="Emergency"><svg viewBox="0 0 24 24"><path d="M12 3l9 18H3L12 3z"/><path d="M12 10v5"/><circle cx="12" cy="17.5" r="0.9"/></svg></a>
      <a class="dock-btn" href="./contacts.html" aria-label="Contacts"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.7"/><path d="M2.6 19c1-3.5 3.8-5.4 5.4-5.4s4.4 1.9 5.4 5.4"/><circle cx="16.6" cy="8.5" r="2.3"/><path d="M21.8 19c-.8-2.8-3-4.5-5-4.5-.8 0-1.5.2-2.1.6"/></svg></a>
      <a class="dock-btn" href="./profile.html" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg></a>
      <a class="dock-btn" href="./plans.html" aria-label="Plans"><svg viewBox="0 0 24 24"><path d="M12 3l2.15 5.2 5.6.5-4.25 3.7 1.3 5.5L12 15.3 7.2 17.9l1.3-5.5L4.25 8.7l5.6-.5z"/></svg></a>
      <a class="dock-btn" href="./settings.html" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg></a>
    </nav>
    <script type="module">
      import { navigation } from "../js/navigation.js";
      import { voice } from "../js/voice.js";
      import { getToken, pages } from "../js/config.js";
      if (!getToken()) location.href = pages().welcome;
      const status = document.getElementById("nav-status");
      document.getElementById("nav-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const destination = document.getElementById("destination").value.trim();
        try {
          sessionStorage.setItem("AI_SIGHT_NAV_DEST", destination);
          location.href = pages().home;
        } catch (error) {
          status.textContent = error.message;
          await voice.speak(error.message);
        }
      });
      document.getElementById("stop-nav").addEventListener("click", () => navigation.stop(true));
      document.getElementById("repeat-nav").addEventListener("click", () => voice.speak(navigation.nextInstruction()));
    </script>
  </body>
</html>
