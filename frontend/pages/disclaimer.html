<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nyota Sight" />
    <meta name="theme-color" content="#04070d" />
    <title>Notice — Nyota Sight</title>
    <link rel="stylesheet" href="../css/main.css?v=34" />
    <link rel="stylesheet" href="../css/accessibility.css?v=6" />
    <link rel="stylesheet" href="../css/responsive.css?v=8" />
  </head>
  <body class="page-panel">
    <a class="skip-link" href="#disclaimer-actions">Skip to Play, Stop, I agree, and I disagree</a>
    <main class="app-shell">
      <header class="brand">
        <p class="brand-kicker">Nyota Sight</p>
        <h1>Please listen</h1>
        <p>Select Play to hear this notice. It does not start by itself. Select Stop to stop it.</p>
      </header>
      <p id="disclaimer-status" class="status-bar" role="status" aria-live="polite">Select Play to hear the notice.</p>
      <article class="card" id="disclaimer-script" aria-label="Disclaimer"></article>
      <div id="disclaimer-actions" class="disclaimer-actions">
        <button class="btn" id="play" type="button">Play</button>
        <button class="btn" id="stop" type="button">Stop</button>
        <button class="btn primary" id="agree" type="button">I agree</button>
        <button class="btn" id="disagree" type="button">I disagree</button>
      </div>
    </main>
    <audio id="tts-player" playsinline webkit-playsinline hidden></audio>
    <script type="module">
      import { voice } from "../js/voice.js?v=59";
      import { getToken, getUser, homeForUser, pages } from "../js/config.js?v=37";
      import {
        agreeNow,
        syncDisclaimerAgreement,
        DISCLAIMER_PARAGRAPHS,
        DISCLAIMER_SCRIPT,
        DISAGREE_SCRIPT,
        agreedAt,
      } from "../js/disclaimer.js?v=3";

      if (agreedAt()) {
        location.replace("../index.html");
      } else {
        const script = document.getElementById("disclaimer-script");
        const status = document.getElementById("disclaimer-status");
        DISCLAIMER_PARAGRAPHS.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          script.appendChild(p);
        });

        const speakRate = 1.25;
        let playing = null;

        function setStatus(text) {
          status.textContent = text;
        }

        function playNotice() {
          voice.unlock({ fromGesture: true });
          setStatus("Playing the notice.");
          const run = voice.speak(DISCLAIMER_SCRIPT, { interrupt: true, rate: speakRate });
          playing = run;
          run.then(() => {
            if (playing === run && !voice.isSpeaking()) setStatus('Select "I agree" or "I disagree".');
          });
        }

        function stopNotice() {
          voice.stopSpeaking();
          playing = null;
          setStatus("Stopped. Select Play to hear the notice.");
        }

        document.getElementById("play").addEventListener("click", playNotice);
        document.getElementById("stop").addEventListener("click", stopNotice);

        document.getElementById("agree").addEventListener("click", async () => {
          voice.unlock({ fromGesture: true });
          voice.stopSpeaking();
          agreeNow();
          setStatus("You agreed. Continuing.");
          await syncDisclaimerAgreement();
          await voice.speak("You agreed.", { interrupt: true, rate: speakRate });
          if (getToken()) location.assign(homeForUser(getUser()));
          else location.assign(pages().welcome);
        });

        document.getElementById("disagree").addEventListener("click", async () => {
          voice.unlock({ fromGesture: true });
          voice.stopSpeaking();
          setStatus("Nyota Sight cannot be used without agreeing to this notice.");
          await voice.speak(DISAGREE_SCRIPT, { interrupt: true, rate: speakRate });
          setStatus("Select Play to hear the notice again.");
        });
      }
    </script>
  </body>
</html>
