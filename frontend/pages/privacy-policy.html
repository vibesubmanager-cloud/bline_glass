<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <script src="../js/disclaimer-gate.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nyota Sight" />
    <meta name="theme-color" content="#04070d" />
    <title>Privacy and policy — Nyota Sight</title>
    <link rel="stylesheet" href="../css/main.css?v=34" />
    <link rel="stylesheet" href="../css/accessibility.css?v=6" />
    <link rel="stylesheet" href="../css/responsive.css?v=8" />
  </head>
  <body class="page-panel">
    <a class="skip-link" href="#privacy-actions">Skip to Play, Stop, I agree, and Next</a>
    <main class="app-shell">
      <header class="brand">
        <p class="brand-kicker">Nyota Sight</p>
        <h1>Privacy and policy</h1>
        <p>Select Play to hear this. It does not start by itself. Select Stop to stop it. Then select I agree, and Next.</p>
      </header>
      <p id="privacy-status" class="status-bar" role="status" aria-live="polite">Select Play to hear the privacy and policy.</p>
      <article class="card" id="privacy-script" aria-label="Privacy and policy"></article>
      <div id="privacy-actions" class="disclaimer-actions">
        <button class="btn" id="play" type="button">Play</button>
        <button class="btn" id="stop" type="button">Stop</button>
        <button class="btn" id="agree" type="button">I agree</button>
        <button class="btn primary" id="next" type="button" disabled>Next</button>
      </div>
      <p class="auth-footer">
        <button class="text-link" id="sign-out" type="button">Sign out</button>
      </p>
    </main>
    <audio id="tts-player" playsinline webkit-playsinline hidden></audio>
    <script type="module">
      import { voice } from "../js/voice.js?v=59";
      import { clearSession, getToken, getUser, pages } from "../js/config.js?v=37";
      import { PRIVACY_PARAGRAPHS, PRIVACY_NOTICE } from "../js/disclaimer.js?v=3";
      import { hasPrivacyAgreement, markPrivacyAgreed, syncPrivacyAgreement } from "../js/entry.js?v=1";

      const user = getUser() || {};
      const nextUrl = user.role === "assistant" ? pages().contacts : pages().permissions;
      if (!getToken()) {
        location.replace(pages().welcome);
      } else if (hasPrivacyAgreement(user)) {
        location.replace(nextUrl);
      } else {
        const script = document.getElementById("privacy-script");
        const status = document.getElementById("privacy-status");
        const agreeBtn = document.getElementById("agree");
        const nextBtn = document.getElementById("next");
        PRIVACY_PARAGRAPHS.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          script.appendChild(p);
        });

        const speakRate = 1.25;
        let agreed = false;
        let playing = null;

        function setStatus(text) {
          status.textContent = text;
        }

        function playPolicy() {
          voice.unlock({ fromGesture: true });
          setStatus("Playing the privacy and policy.");
          const run = voice.speak(PRIVACY_NOTICE, { interrupt: true, rate: speakRate });
          playing = run;
          run.then(() => {
            if (playing !== run || voice.isSpeaking()) return;
            setStatus(agreed ? "You agreed. Select Next." : "Select I agree, then Next.");
          });
        }

        function stopPolicy() {
          voice.stopSpeaking();
          playing = null;
          setStatus(agreed ? "Stopped. Select Next." : "Stopped. Select Play to hear it.");
        }

        document.getElementById("play").addEventListener("click", playPolicy);
        document.getElementById("stop").addEventListener("click", stopPolicy);

        agreeBtn.addEventListener("click", () => {
          voice.unlock({ fromGesture: true });
          voice.stopSpeaking();
          markPrivacyAgreed(user.id);
          agreed = true;
          nextBtn.disabled = false;
          setStatus("You agreed. Select Next.");
          syncPrivacyAgreement(user.id);
          voice.speak("You agreed. Select Next.", { interrupt: true, rate: speakRate });
        });

        nextBtn.addEventListener("click", () => {
          voice.unlock({ fromGesture: true });
          if (!agreed) {
            setStatus("Select I agree before Next.");
            voice.speak("Select I agree before Next.", { interrupt: true, rate: speakRate });
            return;
          }
          voice.stopSpeaking();
          location.assign(nextUrl);
        });

        document.getElementById("sign-out").addEventListener("click", () => {
          voice.stopSpeaking();
          clearSession();
          location.assign(pages().welcome);
        });
      }
    </script>
  </body>
</html>
