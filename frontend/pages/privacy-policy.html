<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <script src="../js/disclaimer-gate.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nyota Sight" />
    <meta name="theme-color" content="#04070d" />
    <title>Privacy — Nyota Sight</title>
    <link rel="stylesheet" href="../css/main.css?v=36" />
    <link rel="stylesheet" href="../css/accessibility.css?v=6" />
    <link rel="stylesheet" href="../css/responsive.css?v=8" />
  </head>
  <body class="page-panel">
    <a class="skip-link" href="#privacy-card">Skip to privacy</a>
    <main class="app-shell">
      <header class="brand">
        <p class="brand-kicker">Nyota Sight</p>
        <h1>Privacy</h1>
        <p>The play icon is at the top. Press it to play. Press it again to pause. Select I agree to continue to the homepage.</p>
      </header>
      <p id="privacy-status" class="status-bar" role="status" aria-live="polite">Press the play icon to hear privacy.</p>
      <article class="card" id="privacy-card" aria-label="Privacy">
        <div class="notice-top">
          <button class="notice-toggle" id="play-toggle" type="button" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
        </div>
        <div id="privacy-script"></div>
      </article>
      <div id="privacy-actions" class="disclaimer-actions">
        <button class="btn primary" id="agree" type="button">I agree</button>
        <button class="btn" id="disagree" type="button">I disagree</button>
      </div>
      <p class="auth-footer">
        <button class="text-link" id="sign-out" type="button">Sign out</button>
      </p>
    </main>
    <audio id="tts-player" playsinline webkit-playsinline hidden></audio>
    <script type="module">
      import { voice } from "../js/voice.js";
      import { clearSession, getToken, getUser, pages } from "../js/config.js?v=38";
      import {
        agreeNow,
        syncDisclaimerAgreement,
        PRIVACY_PAGE_PARAGRAPHS,
        PRIVACY_PAGE_SCRIPT,
        DISAGREE_SCRIPT,
        bindNoticePlayer,
      } from "../js/disclaimer.js?v=5";
      import { clearPrivacyPrompt, markPrivacyAgreed, privacyPromptRequired, syncPrivacyAgreement } from "../js/entry.js?v=2";

      const user = getUser() || {};
      const nextUrl = user.role === "assistant" ? pages().contacts : pages().home;
      if (!getToken()) {
        location.replace(pages().welcome);
      } else if (!privacyPromptRequired()) {
        location.replace(nextUrl);
      } else {
        const script = document.getElementById("privacy-script");
        const status = document.getElementById("privacy-status");

        function setStatus(text) {
          status.textContent = text;
        }

        PRIVACY_PAGE_PARAGRAPHS.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          script.appendChild(p);
        });

        const player = bindNoticePlayer(document.getElementById("play-toggle"), {
          text: PRIVACY_PAGE_SCRIPT,
          onPlay() {
            setStatus("Playing privacy.");
          },
          onPause() {
            setStatus("Paused.");
          },
          onDone() {
            setStatus('Select "I agree" to continue to the homepage.');
          },
        });

        document.getElementById("agree").addEventListener("click", () => {
          voice.unlock({ fromGesture: true });
          player.stop();
          agreeNow();
          markPrivacyAgreed(user.id);
          clearPrivacyPrompt();
          syncDisclaimerAgreement();
          syncPrivacyAgreement(user.id);
          location.assign(nextUrl);
        });

        document.getElementById("disagree").addEventListener("click", async () => {
          voice.unlock({ fromGesture: true });
          player.stop();
          setStatus("Nyota Sight cannot be used without agreeing to this privacy notice.");
          await voice.speak(DISAGREE_SCRIPT, { interrupt: true, rate: 1.25 });
          setStatus("Press the play icon to hear privacy again.");
        });

        document.getElementById("sign-out").addEventListener("click", () => {
          player.stop();
          clearSession();
          location.assign(pages().welcome);
        });
      }
    </script>
  </body>
</html>
