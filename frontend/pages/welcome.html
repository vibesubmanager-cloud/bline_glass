<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Sight" />
    <meta name="theme-color" content="#04070d" />
    <title>AI Sight</title>
    <link rel="stylesheet" href="../css/main.css?v=16" />
    <link rel="stylesheet" href="../css/accessibility.css?v=6" />
    <link rel="stylesheet" href="../css/responsive.css?v=8" />
    <link rel="manifest" href="../manifest.json" />
  </head>
  <body class="page-panel">
    <a class="skip-link" href="#role-grid">Skip to choose account type</a>
    <main class="app-shell">
      <header class="brand">
        <p class="brand-kicker">AI Sight</p>
        <h1>Who is using this phone?</h1>
        <p>Choose one. You can sign in or create an account next.</p>
      </header>
      <section id="role-grid" class="role-grid">
        <a class="role-card" href="./login.html?role=blind">
          <span class="role-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
          </span>
          <strong>Blind person</strong>
          <span>Use the camera, voice, and your contacts.</span>
        </a>
        <a class="role-card" href="./login.html?role=assistant">
          <span class="role-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>
          </span>
          <strong>Assistant</strong>
          <span>Help someone you know. Link with their system ID.</span>
        </a>
      </section>
    </main>
    <script type="module">
      import { redirectIfAuthed } from "../js/auth.js?v=12";
      redirectIfAuthed();
    </script>
  </body>
</html>
